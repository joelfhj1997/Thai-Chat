<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Translator</title>
    <style>
        :root {
            /* Muji Color Palette */
            --bg-color: #F7F6F1;
            --surface-color: #FFFFFF;
            --text-main: #4A4643;
            --text-muted: #8E8A85;
            --border-color: #E2DFD8;
            --accent-color: #9BA493;
            --shadow-color: rgba(74, 70, 67, 0.06);
            --3d-shadow: #D1CEC6;
            
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            line-height: 1.6;
        }

        .container {
            max-width: 540px;
            width: 100%;
            background-color: var(--surface-color);
            padding: 40px 48px;
            border-radius: 28px;
            box-shadow: 8px 8px 24px var(--shadow-color), -8px -8px 24px rgba(255,255,255,0.8), inset 1px 1px 2px rgba(255,255,255,0.8);
            border: 1px solid #F0EEE9;
            position: relative;
        }

        /* BGM Toggle Button in top right */
        #bgmBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        #bgmBtn:hover {
            background-color: #F0EEE9;
            transform: scale(1.05);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 32px;
            text-align: center;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
        }

        label {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        textarea {
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #FAFAFA;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
            box-shadow: inset 4px 4px 10px rgba(0,0,0,0.03), inset -4px -4px 10px rgba(255,255,255,1);
        }

        textarea:focus {
            outline: none;
            background-color: var(--surface-color);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.02), inset -2px -2px 5px rgba(255,255,255,1), 0 0 0 3px rgba(155, 164, 147, 0.15);
        }

        .tone-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 8px;
        }

        button.tone-btn {
            background-color: #FAFAFA;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.05), -3px -3px 8px rgba(255,255,255,0.8), 0 4px 0 var(--3d-shadow);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
            position: relative;
        }

        button.tone-btn:hover {
            transform: scale(1.05) translateY(-2px);
            background-color: #FFFFFF;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.06), -4px -4px 12px rgba(255,255,255,0.9), 0 6px 0 var(--3d-shadow);
        }

        button.tone-btn:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 1px 1px 4px rgba(0,0,0,0.05), -1px -1px 4px rgba(255,255,255,0.8), 0 0 0 var(--3d-shadow);
        }

        button.tone-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: #8A9382;
            --3d-shadow: #7A8472;
            box-shadow: 3px 3px 8px rgba(155,164,147,0.3), -3px -3px 8px rgba(255,255,255,0.8), 0 4px 0 var(--3d-shadow);
        }

        .output-container {
            margin-top: 36px;
            padding-top: 32px;
            border-top: 1px dashed var(--border-color);
            position: relative;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .output-header label { margin-bottom: 0; }

        .action-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.05), 0 2px 0 var(--3d-shadow);
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 var(--3d-shadow);
        }

        .output-box {
            background-color: #FAFAFA;
            border: none;
            border-radius: 16px;
            padding: 24px;
            min-height: 80px;
            font-size: 1.15rem;
            white-space: pre-wrap;
            color: var(--text-main);
            box-shadow: inset 4px 4px 10px rgba(0,0,0,0.03), inset -4px -4px 10px rgba(255,255,255,1);
            position: relative;
            transition: opacity 0.3s;
        }

        /* Animated Dots */
        .dots { display: flex; font-size: 1.2rem; color: var(--accent-color); font-weight: 600; }
        .dots span { opacity: 0; transform: translateX(-10px); animation: dotWave 1.5s infinite ease-out; margin: 0 4px; }
        .dots span:nth-child(1) { animation-delay: 0.0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        .dots span:nth-child(4) { animation-delay: 0.6s; }
        .dots span:nth-child(5) { animation-delay: 0.8s; }

        @keyframes dotWave {
            0% { opacity: 0; transform: translateX(-10px) scale(0.8); }
            30% { opacity: 1; transform: translateX(0) scale(1.2); }
            60%, 100% { opacity: 0; transform: translateX(10px) scale(0.8); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: var(--accent-color);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(155, 164, 147, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
    <!-- Load YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="yt-player" style="position: fixed; top: -9999px; left: -9999px; width: 200px; height: 200px; opacity: 0.01; pointer-events: none;"></div>

<div class="container">
    <button id="bgmBtn">🔊 BGM On</button>
    <h1>THAI TRANSLATOR</h1>

    <div class="input-group">
        <label>Select Tone</label>
        <div class="tone-buttons">
            <button class="tone-btn active" data-tone="Casual">Casual</button>
            <button class="tone-btn" data-tone="Lovely and casual">Lovely & casual</button>
            <button class="tone-btn" data-tone="Playful">Playful</button>
            <button class="tone-btn" data-tone="Lovely Couple">Lovely Couple</button>
        </div>
    </div>

    <div class="input-group">
        <label for="inputText">Your Message</label>
        <textarea id="inputText" placeholder="Type what's on your mind...&#10;(Press Enter to translate, Shift+Enter for a new line)"></textarea>
    </div>

    <div class="output-container">
        <div class="output-header">
            <label>Translation</label>
            <button id="copyBtn" class="action-btn">📋 Copy</button>
        </div>
        <div class="output-box" id="outputBox">Ready when you are...</div>
    </div>
</div>

<div class="toast" id="toast">✨ Copied to clipboard ✨</div>

<script>
    // --- YouTube BGM Setup (Animal Crossing 5 PM) ---
    let ytPlayer;
    let ytReady = false;
    let isBgmPlaying = false;
    let hasManuallyStoppedBgm = false;
    let userHasInteracted = false;
    const bgmBtn = document.getElementById('bgmBtn');

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player', {
            height: '200',
            width: '200',
            videoId: 'D5L36JDKxR0', // Animal Crossing - 5 PM
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'loop': 1,
                'playlist': 'D5L36JDKxR0',
                'playsinline': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        ytReady = true;
        event.target.setVolume(25); // Set cozy volume (25%)
        if (!hasManuallyStoppedBgm) {
            playBgm();
        }
    }

    function onPlayerStateChange(event) {
        // 1 = YT.PlayerState.PLAYING
        if (event.data === 1) {
            isBgmPlaying = true;
            bgmBtn.textContent = '🔊 BGM On';
        } else if (event.data === 2 && hasManuallyStoppedBgm) {
            // 2 = YT.PlayerState.PAUSED
            isBgmPlaying = false;
            bgmBtn.textContent = '🔈 BGM Off';
        }
    }

    function isPlayerActuallyPlaying() {
        return ytReady && ytPlayer && typeof ytPlayer.getPlayerState === 'function' && ytPlayer.getPlayerState() === 1;
    }

    function playBgm() {
        if (!ytReady || hasManuallyStoppedBgm) return;
        try {
            ytPlayer.playVideo();
        } catch (e) {
            console.log('Autoplay pending user gesture');
        }
    }

    function toggleBgm() {
        if (!ytReady) return;
        if (isPlayerActuallyPlaying() || isBgmPlaying) {
            ytPlayer.pauseVideo();
            isBgmPlaying = false;
            hasManuallyStoppedBgm = true;
            bgmBtn.textContent = '🔈 BGM Off';
        } else {
            hasManuallyStoppedBgm = false;
            playBgm();
            isBgmPlaying = true;
            bgmBtn.textContent = '🔊 BGM On';
        }
    }

    // --- Sound Effects (Interactive UI sounds) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol, slideFreq) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if(slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function soundHover() { initAudio(); playTone(900, 'sine', 0.05, 0.02); }
    function soundClick() { initAudio(); playTone(1500, 'sine', 0.1, 0.05, 500); }
    function soundEnter() { 
        initAudio(); 
        playTone(600, 'sine', 0.1, 0.05, 1200); 
        setTimeout(() => playTone(1200, 'sine', 0.2, 0.05, 2400), 100);
    }


    document.addEventListener('DOMContentLoaded', () => {
        const inputText = document.getElementById('inputText');
        const outputBox = document.getElementById('outputBox');
        const toneBtns = document.querySelectorAll('.tone-btn');
        const toast = document.getElementById('toast');
        const copyBtn = document.getElementById('copyBtn');

        // Start BGM on user interaction if not already playing
        function tryStartBgmOnInteraction() {
            initAudio();
            userHasInteracted = true;
            if (!hasManuallyStoppedBgm) {
                if (ytReady) {
                    if (!isPlayerActuallyPlaying()) {
                        playBgm();
                    }
                }
            }
        }

        window.addEventListener('click', tryStartBgmOnInteraction, { passive: true });
        window.addEventListener('keydown', tryStartBgmOnInteraction, { passive: true });
        window.addEventListener('touchstart', tryStartBgmOnInteraction, { passive: true });
        
        // Manual BGM Toggle Button
        bgmBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleBgm();
        });

        // Copy Button Manual
        copyBtn.addEventListener('click', () => {
            soundClick();
            const textToCopy = outputBox.innerText;
            if(textToCopy && textToCopy !== 'Ready when you are...') {
                navigator.clipboard.writeText(textToCopy).then(showToast);
            }
        });

        let currentTone = 'Casual';
        toneBtns.forEach(btn => {
            btn.addEventListener('mouseenter', soundHover);
            btn.addEventListener('mousedown', soundClick);
            btn.addEventListener('click', () => {
                toneBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTone = btn.getAttribute('data-tone');
                inputText.focus();
            });
        });

        inputText.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = inputText.value.trim();
                if(text) {
                    soundEnter();
                    animateSendBox();
                    await translateText(text);
                }
            }
        });

        function animateSendBox() {
            const boxRect = inputText.getBoundingClientRect();
            const targetRect = outputBox.getBoundingClientRect();
            
            const ghost = document.createElement('div');
            ghost.textContent = inputText.value;
            ghost.style.position = 'fixed';
            ghost.style.left = boxRect.left + 'px';
            ghost.style.top = boxRect.top + 'px';
            ghost.style.width = boxRect.width + 'px';
            ghost.style.height = boxRect.height + 'px';
            ghost.style.backgroundColor = '#FAFAFA';
            ghost.style.borderRadius = '16px';
            ghost.style.padding = '16px 20px';
            ghost.style.color = 'rgba(74, 70, 67, 0.5)';
            ghost.style.zIndex = '999';
            ghost.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)';
            ghost.style.transition = 'all 0.5s cubic-bezier(0.5, 0, 0.2, 1)';
            ghost.style.pointerEvents = 'none';
            ghost.style.boxSizing = 'border-box';
            ghost.style.whiteSpace = 'pre-wrap';
            
            document.body.appendChild(ghost);
            ghost.offsetHeight; // force reflow
            
            ghost.style.top = (targetRect.top + 10) + 'px';
            ghost.style.left = (targetRect.left + 10) + 'px';
            ghost.style.width = (targetRect.width - 20) + 'px';
            ghost.style.height = (targetRect.height - 20) + 'px';
            ghost.style.opacity = '0';
            ghost.style.transform = 'scale(0.8)';
            
            setTimeout(() => { if(document.body.contains(ghost)) document.body.removeChild(ghost); }, 500);
            inputText.value = '';
        }

        async function translateText(text) {
            outputBox.innerHTML = '<div class="dots"><span>.</span><span>.</span><span>.</span><span>.</span><span>.</span></div>';

            const maxRetries = 10;
            const delayMs = 5000;

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text, tone: currentTone })
                    });

                    if (!response.ok) {
                        // Render free tier sleeping errors
                        if (response.status === 502 || response.status === 503 || response.status === 504) {
                            if (i === maxRetries - 1) {
                                throw new Error('Server took too long to wake up. Please try again.');
                            }
                            outputBox.innerHTML = '<div style="font-size: 0.95rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">☕ Waking up server... <div class="dots" style="font-size: 1rem;"><span>.</span><span>.</span><span>.</span></div></div>';
                            await new Promise(r => setTimeout(r, delayMs));
                            continue;
                        }
                        
                        let errorMsg = 'Failed to translate';
                        try {
                            const errData = await response.json();
                            errorMsg = errData.error || errorMsg;
                        } catch(e) {
                            errorMsg = `Server error (${response.status}).`;
                        }

                        // Auto-retry if Google AI is experiencing a temporary spike in traffic
                        if (errorMsg.includes('high demand') || errorMsg.includes('503') || errorMsg.includes('UNAVAILABLE')) {
                            if (i === maxRetries - 1) {
                                throw new Error('Google AI is currently under heavy load. Please try again in a moment! ⏳');
                            }
                            outputBox.innerHTML = '<div style="font-size: 0.95rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">⏳ Google AI is busy, retrying... <div class="dots" style="font-size: 1rem;"><span>.</span><span>.</span><span>.</span></div></div>';
                            await new Promise(r => setTimeout(r, 2500));
                            continue;
                        }

                        throw new Error(errorMsg);
                    }
                    
                    const translation = (await response.json()).translation;
                    
                    outputBox.style.opacity = 0;
                    setTimeout(() => {
                        outputBox.textContent = translation;
                        outputBox.style.opacity = 1;
                        
                        navigator.clipboard.writeText(translation)
                            .then(showToast)
                            .catch(e => console.log('Auto-copy blocked by browser. User must click copy.'));
                    }, 200);
                    
                    return; // Success, exit the function

                } catch (error) {
                    const isRetryable = error.message.includes('fetch') || 
                                        error.message.includes('Network') ||
                                        error.message.includes('high demand') ||
                                        error.message.includes('503');

                    if (i === maxRetries - 1 || !isRetryable) {
                        outputBox.textContent = `Error: ${error.message}`;
                        return;
                    }
                    
                    outputBox.innerHTML = '<div style="font-size: 0.95rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">☕ Retrying translation... <div class="dots" style="font-size: 1rem;"><span>.</span><span>.</span><span>.</span></div></div>';
                    await new Promise(r => setTimeout(r, delayMs));
                }
            }
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    });
</script>
</body>
</html>
